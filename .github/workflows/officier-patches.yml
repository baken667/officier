name: Officier patches
on:
  push:
    paths: ['patches/**', 'scripts/**', 'tests/**', '.github/workflows/officier-patches.yml']
  pull_request:
    paths: ['patches/**', 'scripts/**', 'tests/**', '.github/workflows/officier-patches.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git submodule update --init --depth 1 -- server
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/patches.py apply
      - run: python3 scripts/patches.py apply
      - run: node --test tests/capabilities.test.cjs
      - run: python3 scripts/patches.py revert
      - run: test -z "$(git -C server status --porcelain)"
